<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo del isotipo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2F5C"/>
      <stop offset="50%" stop-color="#071E3D"/>
      <stop offset="100%" stop-color="#041226"/>
    </linearGradient>

    <!-- Gradiente tecnológico Cyan -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0085CA"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Gradiente Rojo Oficial Perú -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#C8102E"/>
    </linearGradient>

    <!-- Gradiente Naranja Innovación Vincúlate -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Filtro de Resplandor Neón CTI -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base redondeada tipo app icon moderno -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Borde perimetral sutil -->
  <rect x="1" y="1" width="118" height="118" rx="27" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Órbita elíptica 1 (Ciencia / Átomo) -->
  <ellipse cx="60" cy="60" rx="44" ry="18" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-dasharray="4 2" transform="rotate(-30 60 60)" opacity="0.85"/>
  
  <!-- Órbita elíptica 2 (Innovación) -->
  <ellipse cx="60" cy="60" rx="44" ry="18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" transform="rotate(30 60 60)"/>

  <!-- Líneas de interconexión de red (Conecta) -->
  <line x1="60" y1="60" x2="26" y2="40" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="60" y1="60" x2="94" y2="40" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="60" y1="60" x2="60" y2="95" stroke="url(#orangeGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="26" y1="40" x2="60" y2="25" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="94" y1="40" x2="60" y2="25" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Nodos de la red periférica -->
  <!-- Nodo Superior Central (Conocimiento / Perú) -->
  <circle cx="60" cy="25" r="5.5" fill="url(#redGrad)" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)"/>

  <!-- Nodo Izquierdo (Academia / Investigador) -->
  <circle cx="26" cy="40" r="6" fill="#38BDF8" stroke="#0B2F5C" stroke-width="2" filter="url(#glow)"/>

  <!-- Nodo Derecho (Industria / Empresa) -->
  <circle cx="94" cy="40" r="6" fill="#0085CA" stroke="#FFFFFF" stroke-width="2" filter="url(#glow)"/>

  <!-- Nodo Inferior (Sociedad / Impacto) -->
  <circle cx="60" cy="95" r="5" fill="url(#orangeGrad)" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Núcleo Central: Vórtice Conecta Concytec -->
  <circle cx="60" cy="60" r="16" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="10" fill="url(#cyanGrad)"/>
  <circle cx="60" cy="60" r="4.5" fill="#FFFFFF"/>

  <!-- Micro satélite orbitando -->
  <circle cx="88" cy="74" r="3" fill="#F8FAFC" opacity="0.9"/>
  <circle cx="32" cy="74" r="2.5" fill="#F59E0B" opacity="0.8"/>
</svg>
